[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttap-mdp"
version = "1.0.0"
description = "Event-driven stochastic TTAP MDP with online baselines and RL adapters"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.25",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
]
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "tensorboard>=2.15",
    "tqdm>=4.66",
    "rich>=13.0",
]
all = [
    "ipykernel>=6.25",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "tensorboard>=2.15",
    "tqdm>=4.66",
    "rich>=13.0",
]

[project.scripts]
ttap-demo = "ttap_mdp.demo:main"
ttap-train-ppo = "ttap_mdp.training.train_ppo:main"
ttap-train-dqn = "ttap_mdp.training.train_dqn:main"
ttap-evaluate-rl = "ttap_mdp.training.evaluate_rl:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttap_mdp*"]
